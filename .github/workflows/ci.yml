name: CI

# pull_request is unfiltered: stacked PRs (based on other feature branches)
# must run CI too.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # DeterminateSystems' installer: reliable on the macOS runners, where
      # cachix/install-nix-action trips over pre-existing nix build users.
      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      # Builds this system's `checks.<system>.e2e`: a hermetic run where a Node
      # provider (child process) and a Node consumer exchange calls + events
      # over a plain transport, plus a .lidl→JS codegen round-trip — all with no
      # liblogos_core and no Qt event loop. koffi's prebuilt binary ships in the
      # npm package, so nothing is compiled in the sandbox.
      - name: e2e (protocol-native provider ↔ consumer, Qt-free)
        run: nix flake check -L
